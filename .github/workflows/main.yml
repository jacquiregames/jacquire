name: Build Windows App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  release:
    types: [published] # Triggers the workflow when you publish a new Release

jobs:
  build:
    runs-on: windows-latest

    # Gives the GitHub Actions bot permission to upload files to your releases
    permissions:
      contents: write 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24' # Updated Node version

    - name: Install pnpm
      run: npm install -g pnpm

    - name: Install Frontend Dependencies & Build
      run: |
        pnpm install
        pnpm run build

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'  

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn websockets pydantic pywebview pyinstaller requests

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --name "jAcquire" --noconsole --onefile --add-data "dist;dist" desktop.py

    - name: Upload Windows Executable
      uses: actions/upload-artifact@v6
      with:
        name: jAcquire-Windows
        path: dist/jAcquire.exe

    # Automatically attach the .exe to the Release page
    - name: Upload to GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: dist/jAcquire.exe
